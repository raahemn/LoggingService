<match app.**>
  @type mongo
  connection_string "mongodb+srv://logstream:ZcQ99tKbtzMNyoZA@cluster0.hrotqyq.mongodb.net/logs"
  database logs
  collection logs

  <buffer>
    @type memory
    flush_interval 5s
    chunk_limit_size 1M
  </buffer>
</match>
