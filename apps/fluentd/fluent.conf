<source>
  @type tail
  path /var/log/simulator/app1.log
  pos_file /tmp/fluentd-app1.log.pos
  tag app.var.log.simulator.app1.log
  path_key source_file
  <parse>
    @type regexp
    expression /^\[(?<timestamp>.+?)\] \[(?<logLevel>.+?)\] \[(?<traceId>.+?)\] (?<message>.*)$/
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%LZ
  </parse>
  refresh_interval 1s
  read_from_head true
</source>

